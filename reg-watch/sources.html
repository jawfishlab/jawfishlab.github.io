<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>収集対象国・規制当局一覧 | APAC Regulation Monitor</title>
  <meta name="description" content="APAC Regulation Monitor が公式公表を収集している国・地域と、金融規制当局および関連政府機関の一覧">
  <link rel="alternate" type="application/rss+xml" title="APAC Regulation Monitor" href="feed.xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <p class="crumb"><a href="./">APAC Regulation Monitor</a> <span aria-hidden="true">›</span> 収集対象国・規制当局一覧</p>
      <div class="title-row">
        <h1>収集対象国・規制当局一覧</h1>
      </div>
      <p class="tagline">公式公表を自動収集している国・地域と、金融規制当局および関連政府機関の一覧です。</p>
      <dl class="meta">
        <div><dt>収集対象</dt><dd id="dir-summary">—</dd></div>
      </dl>
    </div>
  </header>

  <main class="wrap">
    <p class="status" id="status" aria-live="polite">読み込み中…</p>

    <section class="dir-section" id="active" aria-labelledby="active-title" hidden>
      <h2 id="active-title">収集対象</h2>
      <div id="active-list"></div>
    </section>

    <section class="dir-section" id="inactive" aria-labelledby="inactive-title" hidden>
      <h2 id="inactive-title">設定済み・現在収集対象外</h2>
      <p class="section-note">収集の設定はあるものの、現在は収集を停止している当局です。収集対象の国・地域数と当局数には含めていません。</p>
      <div id="inactive-list"></div>
    </section>

    <p class="back-row"><a href="./">← 公表一覧に戻る</a></p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>データ：<a href="data/sources.json">sources.json</a>。「収集対象」は設定上の区分で、直近の取得が成功したかどうかや、収録件数の有無とは関係ありません。</p>
    </div>
  </footer>

  <script src="sources.js"></script>
</body>
</html>
